<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
</head>
<body>
    <form action="/submit" method="POST">
        
        <h2>Basic Info</h2>
        <hr>
        
        <label for="employeeId">Employee ID</label>
        <input type="number" id="employeeId" name="employeeId" value="9" readonly>
        <br><br>
        
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" value="Dodsworth">
        <br><br>
        
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" value="Anne" required>
        <br><br>
        
        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="xxx" name="gender" value="xxx">
        <label for="xxx">XXX</label><br>
        <input type="radio" id="zzz" name="gender" value="zzz" checked>
        <label for="zzz">ZZZ</label>
        <br><br>
        
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="Sales Representative">
        <br><br>
        
        <label for="suffix">Suffix</label>
        <input type="text" id="suffix" name="suffix" value="Ms.">
        <br><br>
        
        <label for="birthDate">BirthDate</label>
        <input type="datetime-local" id="birthDate" name="birthDate" value="1969-07-02T00:00">
        <br><br>
        
        <label for="hireDate">HireDate</label>
        <input type="datetime-local" id="hireDate" name="hireDate" value="1994-11-15T00:00">
        <br><br>
        
        <label for="ssn">SSN # (if applicable)</label>
        <input type="text" id="ssn" name="ssn">
        <br><br>
        
        <label for="reportsTo">Reports To</label>
        <select id="reportsTo" name="reportsTo">
            <option value="buchanan" selected>Buchanan</option>
            <option value="fuller">Fuller</option>
            <option value="leverling">Leverling</option>
        </select>
        <br><br>
        
        <h2>Contact Info</h2>
        <hr>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">
        <br><br>
        
        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="7 Houndstooth Rd.">
        <br><br>
        
        <label for="city">City</label>
        <input type="text" id="city" name="city" value="London">
        <br><br>
        
        <label for="region">Region</label>
        <input type="text" id="region" name="region">
        <br><br>
        
        <label for="postalCode">Postal Code</label>
        <input type="text" id="postalCode" name="postalCode" value="WG2 7LT">
        <br><br>
        
        <label for="country">Country</label>
        <select id="country" name="country">
            <option value="">Select Country</option>
            <option value="russian-federation" selected>Russian Federation</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
        </select>
        <br><br>
        
        <label for="usHomePhone">US Home Phone</label>
        <input type="tel" id="usHomePhone" name="usHomePhone" value="(234)234-2342">
        <br><br>
        
        <label for="photoDisplay">Photo</label>
        <input type="text" id="photoDisplay" value="EmpID9.bmp" readonly>
        <input type="file" id="photo" name="photo" accept="image/*" hidden>
        <br><br>
        
        <h2>Optional Info</h2>
        <hr>
        
        <label for="notes">Notes</label><br>
        <textarea id="notes" name="notes" rows="6" cols="50">Anne has a BA degree in English from St. Lawrence College. She is fluent in French and German ZZZ</textarea>
        <br><br>
        
        <label>Preferred Shift</label><br>
        <input type="checkbox" id="regular" name="preferredShift" value="regular">
        <label for="regular">Regular</label><br>
        <input type="checkbox" id="gravyYard" name="preferredShift" value="gravyYard" checked>
        <label for="gravyYard">Gravy Yard</label>
        <br><br>
        
        <label for="active">Active?</label>
        <input type="checkbox" id="active" name="active" checked>
        <br><br>
        
        <p>TIDAWO</p>
        <label>Are you human?</label><br>
        <p>Click to change<p><br>
        <input type="text" id="captcha" name="captcha" required>
        <br><br>
        
        <hr>
        
        <button type="button">◄</button>
        <button type="button">►</button>
        
        <button type="submit">Submit</button>
        <button type="reset">Cancel</button>
        
        <br><br>
        <p>* required</p>
        
    </form>
</body>
</html>
